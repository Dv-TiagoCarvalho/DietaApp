<!doctype html>
<html lang="pt-BR">
<head>
<title>Dieta Tiago</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{background:#f2f2f7}@media (prefers-color-scheme:dark){html{background:#000}}</style>
<style>
/* Layout: lista agrupada estilo iOS — título grande, anéis de atividade, seções inseridas com cantos arredondados */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fg:#000000; --muted:#8a8a8e; --sep:rgba(60,60,67,.18);
  --blue:#007aff; --green:#34c759; --fill:#e5e5ea;
  --r1:#fa114f; --r2:#92e82a; --r3:#1eaaef; --ringbg:.18;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Roboto,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fg:#ffffff; --muted:#8d8d93; --sep:rgba(84,84,88,.6);
  --blue:#0a84ff; --green:#30d158; --fill:#2c2c2e; --r3:#1eeaef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fg:#ffffff; --muted:#8d8d93; --sep:rgba(84,84,88,.6);
  --blue:#0a84ff; --green:#30d158; --fill:#2c2c2e; --r3:#1eeaef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

header .day{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:2px 0 0}

.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.01em;padding:0 16px 7px;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:12px;overflow:hidden}

.summary{padding:16px;display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
.rings{width:120px;height:120px}
.rings svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.rings circle{fill:none;stroke-width:13;stroke-linecap:round}
.rings .t{opacity:var(--ringbg)}
.rings .p{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-direction:column;gap:10px;min-width:0}
.lg{display:flex;flex-direction:column}
.lg span{font-size:15px;font-weight:600}
.lg b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lg b small{font-size:15px;color:var(--muted);font-weight:500}

.row{display:flex;align-items:center;gap:14px;min-height:50px;padding:10px 16px;position:relative;cursor:pointer;user-select:none}
.row + .row::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--sep)}
.row input{position:absolute;opacity:0;pointer-events:none}
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--muted);opacity:.7;display:grid;place-items:center;transition:background .2s,border-color .2s,opacity .2s}
.chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;transform:scale(.4);opacity:0;transition:transform .25s cubic-bezier(.3,1.5,.6,1),opacity .15s}
.row input:checked + .chk{background:var(--green);border-color:var(--green);opacity:1}
.row input:checked + .chk svg{transform:none;opacity:1}
.row:focus-within{background:var(--fill)}
.food{flex:1;min-width:0;transition:color .2s}
.row input:checked ~ .food{color:var(--muted)}
.qty{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.mealhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 7px}
.mealhead h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0;display:flex;align-items:center;gap:8px}
.mealhead h2 .done{width:18px;height:18px;border-radius:50%;background:var(--green);display:none;place-items:center}
.mealhead h2 .done svg{width:10px;height:10px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.meal.complete .mealhead h2 .done{display:grid}
.link{background:none;border:0;padding:0;font:inherit;font-size:15px;color:var(--blue);cursor:pointer}
.link:focus-visible,.stepper button:focus-visible,.drop:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.water{padding:16px;display:flex;flex-direction:column;gap:14px}
.drops{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.drop{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;background:var(--fill);cursor:pointer;padding:0;transition:background .25s,transform .15s}
.drop:active{transform:scale(.9)}
.drop.on{background:var(--r3)}
.wfoot{display:flex;justify-content:space-between;align-items:center}
.wfoot b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.wfoot small{color:var(--muted);font-size:15px;font-weight:400}
.stepper{display:flex;background:var(--fill);border-radius:9px;overflow:hidden}
.stepper button{width:48px;height:32px;border:0;background:none;color:var(--fg);font-size:22px;font-weight:300;cursor:pointer;line-height:1}
.stepper i{width:.5px;background:var(--sep);margin:6px 0}

.week{padding:16px 12px 12px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.wd svg{width:34px;height:34px;transform:rotate(-90deg)}
.wd circle{fill:none;stroke-width:5;stroke-linecap:round}
.wd.today span{color:var(--fg);font-weight:700}
.streak{padding:12px 16px;border-top:.5px solid var(--sep);font-size:15px;color:var(--muted)}
.streak b{color:var(--fg);font-weight:600}

.reset{display:flex;flex-direction:column}
.reset button{background:var(--card);border:0;font:inherit;padding:14px;cursor:pointer;color:var(--blue)}
.reset .danger{color:#ff3b30;font-weight:600}
.reset button + button{border-top:.5px solid var(--sep)}
.foot{font-size:13px;color:var(--muted);padding:8px 16px 0;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="day" id="date"></div>
    <h1>Dieta</h1>
  </header>

  <section aria-label="Resumo">
    <div class="label"><span>Resumo</span></div>
    <div class="card summary">
      <div class="rings">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="t" cx="60" cy="60" r="53" stroke="var(--r1)"/>
          <circle class="p" id="ring1" cx="60" cy="60" r="53" stroke="var(--r1)"/>
          <circle class="t" cx="60" cy="60" r="38" stroke="var(--r2)"/>
          <circle class="p" id="ring2" cx="60" cy="60" r="38" stroke="var(--r2)"/>
          <circle class="t" cx="60" cy="60" r="23" stroke="var(--r3)"/>
          <circle class="p" id="ring3" cx="60" cy="60" r="23" stroke="var(--r3)"/>
        </svg>
      </div>
      <div class="legend">
        <div class="lg"><span style="color:var(--r1)">Refeições</span><b id="lMeals">0<small>/4</small></b></div>
        <div class="lg"><span style="color:var(--r2)">Alimentos</span><b id="lItems">0<small>/14</small></b></div>
        <div class="lg"><span style="color:var(--r3)">Água</span><b id="lWater">0<small>/2 L</small></b></div>
      </div>
    </div>
  </section>

  <div id="meals" style="display:flex;flex-direction:column;gap:28px"></div>

  <section aria-label="Água">
    <div class="mealhead"><h2>Água</h2></div>
    <div class="card water">
      <div class="drops" id="drops"></div>
      <div class="wfoot">
        <b id="wLabel">0 <small>de 8 copos · 250 ml</small></b>
        <div class="stepper"><button id="wMinus" type="button" aria-label="Remover copo">−</button><i></i><button id="wPlus" type="button" aria-label="Adicionar copo">+</button></div>
      </div>
    </div>
  </section>

  <section aria-label="Últimos 7 dias">
    <div class="mealhead"><h2>Últimos 7 dias</h2></div>
    <div class="card">
      <div class="week" id="week"></div>
      <div class="streak" id="streak"></div>
    </div>
  </section>

  <section>
    <div class="card reset">
      <button id="resetBtn" type="button">Zerar o dia</button>
      <button id="resetYes" class="danger" type="button" hidden>Zerar tudo de hoje</button>
      <button id="resetNo" type="button" hidden>Cancelar</button>
    </div>
    <p class="foot">O progresso fica salvo neste celular e recomeça todo dia à meia-noite.</p>
  </section>
</div>

<script>
const MEALS=[
  {id:"cafe",title:"Café da manhã",items:[["Pão integral","2 fatias"],["Ovo inteiro","1 un"],["Claras de ovo","2 un"],["Iogurte natural desnatado","1 un"]]},
  {id:"almoco",title:"Almoço",items:[["Arroz branco","100 g"],["Feijão","100 g"],["Proteína de soja","100 g"]]},
  {id:"lanche",title:"Lanche da tarde",items:[["Whey protein","30 g"],["Banana","1 un"],["Aveia","30 g"],["Pasta de amendoim","10 g"]]},
  {id:"jantar",title:"Jantar",items:[["Arroz branco","100 g"],["Feijão","100 g"],["Proteína de soja","100 g"]]}
];
const CUPS=8, TOTAL=MEALS.reduce((n,m)=>n+m.items.length,0);
const KEY="dieta-tiago-v1";
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let today=dkey(new Date());
let db={};
try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const day=()=>db[today]||(db[today]={c:{},w:0});
const scoreOf=d=>{if(!d)return 0;const c=Object.values(d.c||{}).filter(Boolean).length;return (c+Math.min(d.w||0,CUPS))/(TOTAL+CUPS)};
const setRing=(el,r,v)=>{const L=2*Math.PI*r;el.style.strokeDasharray=L;el.style.strokeDashoffset=L*(1-Math.min(1,Math.max(0,v)))+(v<=0?0.001:0)};
const ck='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const mealsEl=document.getElementById("meals");
MEALS.forEach(m=>{
  const s=document.createElement("section");s.className="meal";s.id="m-"+m.id;
  s.innerHTML=`<div class="mealhead"><h2>${m.title}<span class="done">${ck}</span></h2><button class="link" type="button"></button></div>
  <div class="card">${m.items.map((it,i)=>`<label class="row"><input type="checkbox" id="${m.id}-${i}" data-k="${m.id}-${i}"><span class="chk">${ck}</span><span class="food">${it[0]}</span><span class="qty">${it[1]}</span></label>`).join("")}</div>`;
  s.querySelector(".link").onclick=()=>{
    const d=day(),keys=m.items.map((_,i)=>`${m.id}-${i}`),all=keys.every(k=>d.c[k]);
    keys.forEach(k=>d.c[k]=!all);save();render();
  };
  mealsEl.appendChild(s);
});
mealsEl.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;day().c[k]=e.target.checked;save();render()});

const dropsEl=document.getElementById("drops");
for(let i=0;i<CUPS;i++){const b=document.createElement("button");b.className="drop";b.type="button";b.setAttribute("aria-label",`Copo ${i+1}`);b.onclick=()=>{const d=day();d.w=d.w===i+1?i:i+1;save();render()};dropsEl.appendChild(b)}
document.getElementById("wPlus").onclick=()=>{const d=day();d.w=Math.min(CUPS,(d.w||0)+1);save();render()};
document.getElementById("wMinus").onclick=()=>{const d=day();d.w=Math.max(0,(d.w||0)-1);save();render()};

const rb=document.getElementById("resetBtn"),ry=document.getElementById("resetYes"),rn=document.getElementById("resetNo");
const toggleReset=on=>{rb.hidden=on;ry.hidden=!on;rn.hidden=!on};
rb.onclick=()=>toggleReset(true);rn.onclick=()=>toggleReset(false);
ry.onclick=()=>{db[today]={c:{},w:0};save();toggleReset(false);render()};

function render(){
  const now=new Date();today=dkey(now);
  const d=day();
  document.getElementById("date").textContent=now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  let done=0,mealsDone=0;
  MEALS.forEach(m=>{
    const s=document.getElementById("m-"+m.id);let c=0;
    m.items.forEach((_,i)=>{const k=`${m.id}-${i}`,on=!!d.c[k];document.getElementById(k).checked=on;if(on)c++});
    done+=c;const full=c===m.items.length;if(full)mealsDone++;
    s.classList.toggle("complete",full);
    s.querySelector(".link").textContent=full?"Desmarcar":"Marcar tudo";
  });
  const w=d.w||0;
  [...dropsEl.children].forEach((c,i)=>c.classList.toggle("on",i<w));
  document.getElementById("wLabel").innerHTML=`${w} <small>de ${CUPS} copos · 250 ml</small>`;
  document.getElementById("lMeals").innerHTML=`${mealsDone}<small>/${MEALS.length}</small>`;
  document.getElementById("lItems").innerHTML=`${done}<small>/${TOTAL}</small>`;
  document.getElementById("lWater").innerHTML=`${(w*.25).toLocaleString("pt-BR")}<small>/2 L</small>`;
  setRing(document.getElementById("ring1"),53,mealsDone/MEALS.length);
  setRing(document.getElementById("ring2"),38,done/TOTAL);
  setRing(document.getElementById("ring3"),23,w/CUPS);

  const wk=document.getElementById("week");wk.innerHTML="";
  for(let i=6;i>=0;i--){
    const dt=new Date(now);dt.setDate(now.getDate()-i);
    const v=scoreOf(db[dkey(dt)]),L=2*Math.PI*14;
    const el=document.createElement("div");el.className="wd"+(i===0?" today":"");
    el.innerHTML=`<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" stroke="var(--green)" opacity=".18"/><circle cx="17" cy="17" r="14" stroke="var(--green)" stroke-dasharray="${L}" stroke-dashoffset="${v>0?L*(1-v):L}"/></svg><span>${dt.toLocaleDateString("pt-BR",{weekday:"narrow"})}</span>`;
    wk.appendChild(el);
  }
  let streak=0;
  for(let i=0;i<365;i++){const dt=new Date(now);dt.setDate(now.getDate()-i);if(scoreOf(db[dkey(dt)])>=1)streak++;else if(i>0)break;}
  document.getElementById("streak").innerHTML=streak?`Sequência de <b>${streak} dia${streak>1?"s":""}</b> com a dieta completa.`:`Complete tudo hoje para começar uma sequência.`;
}
render();
setInterval(()=>{if(dkey(new Date())!==today)render()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
